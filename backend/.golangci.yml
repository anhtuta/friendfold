version: "2"

run:
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - errorlint
    - contextcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anhtuta/friendfold/backend
  exclusions:
    generated: lax
