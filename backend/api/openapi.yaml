openapi: 3.1.0
info:
  title: Friendfold API
  version: 0.1.0
  description: |
    HTTP API for Friendfold. All paths are versioned under `/v1`.
    Resource IDs are Snowflake 64-bit integers serialized as decimal strings
    (JavaScript cannot safely hold them as numbers). JSON field names are camelCase.

    Application errors use the envelope
    `{ "error": { "code": "...", "message": "...", "details": {} } }`.
    The public ready probe is the exception: a failed dependency ping returns
    `{"status":"unavailable"}` with no dependency names or URLs.

    Platform probes are public (`security: []`). User operations authenticate
    with `cookieAuth` (cookie `friendfold_session`).

    Mutating `/v1/auth/*` and `/v1/me/profile*` requests must send `Origin`
    matching `WEB_ORIGIN`. Login and register send credentials in the JSON
    body, then set the session cookie. Logout and other cookie-authenticated
    writes also require Origin.

    Every response includes `X-Request-Id` (echoed from the client when valid,
    otherwise generated).
servers:
  - url: http://localhost:8080
    description: Local development (`API_ADDR`, default `:8080`)
tags:
  - name: platform
    description: Process liveness and dependency readiness. No product data.
  - name: auth
    description: Email/password accounts, email verification, password reset, and server-side sessions.
  - name: profile
    description: Username, display name, bio, avatar, and cover. Public profiles and own-profile edits.
security: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags:
        - platform
      summary: Process liveness
      description: |
        Returns 200 when the API process is up. Does not check Postgres or Redis.
      security: []
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
  /v1/ready:
    get:
      operationId: getReady
      tags:
        - platform
      summary: Postgres and Redis reachability
      description: |
        Returns 200 when the write Postgres pool, read Postgres pool, and Redis
        all ping. Returns 503 otherwise. Does not check process-only liveness
        details and does not report which dependency failed (public probe).
        Application errors still use `ErrorEnvelope`; this probe does not.
      security: []
      responses:
        "200":
          description: Postgres and Redis are reachable
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
        "503":
          description: A dependency ping failed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableResponse"
              examples:
                unavailable:
                  value:
                    status: unavailable
  /v1/auth/register:
    post:
      operationId: registerUser
      tags:
        - auth
      summary: Create an account
      description: |
        Creates a user with an argon2id password hash, starts a server-side
        session, and sets the `friendfold_session` cookie.

        Password: 8–72 bytes, must not equal the email (case-insensitive).
        Date of birth must be 13+ (UTC calendar date). `termsAccepted` must be
        true. Email is stored lowercased; a live (non-deleted) email is unique.

        After the user and session are committed, a verification email is
        enqueued (24h single-use token). SMTP or queue failure is logged and
        does **not** fail registration; the user can resend. The account can
        use the product with `emailVerified: false`.

        Unknown JSON fields are rejected. Rate limited per IP and per email hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              signup:
                value:
                  email: minh@example.com
                  password: correct-horse-battery
                  displayName: Minh
                  dateOfBirth: "1998-04-12"
                  termsAccepted: true
      responses:
        "201":
          description: Account created; session cookie set
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                created:
                  value:
                    id: "193848201234567890"
                    email: minh@example.com
                    emailVerified: false
                    displayName: Minh
        "400":
          $ref: "#/components/responses/RegisterValidationError"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "409":
          $ref: "#/components/responses/EmailTaken"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/login:
    post:
      operationId: loginUser
      tags:
        - auth
      summary: Sign in with email and password
      description: |
        Authenticates email + password, starts a session, and sets the
        `friendfold_session` cookie.

        Unknown email and wrong password both return 401 `invalid_credentials`
        with the same body (no user enumeration). Rate limited per IP and per
        email hash. Unknown JSON fields are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              login:
                value:
                  email: minh@example.com
                  password: correct-horse-battery
      responses:
        "200":
          description: Authenticated; session cookie set
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/logout:
    post:
      operationId: logoutUser
      tags:
        - auth
      summary: Sign out
      description: |
        Revokes the current session in Redis and clears the session cookie.
        Requires a valid session cookie and Origin matching `WEB_ORIGIN`.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session revoked; cookie cleared
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginMismatch"
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - auth
      summary: Current user
      description: |
        Returns the signed-in user. Requires a valid session cookie.
        Date of birth is not included (personal data; not shown on profiles).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The authenticated user
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
        - auth
      summary: Verify email with a one-time token
      description: |
        Consumes a single-use `verify_email` token issued at registration or
        resend and sets `email_verified_at`. Public: the token is the
        capability. Session cookie is not required.

        Unknown, expired, consumed, and malformed tokens all return 400
        `invalid_token` with the same body. An empty token is 400
        `validation_error`. Success is 204; the client should call
        `GET /v1/auth/me` when signed in.

        Rate limited per IP. Origin must match `WEB_ORIGIN`. Unknown JSON
        fields are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
            examples:
              token:
                value:
                  token: example-verify-token
      responses:
        "204":
          description: Email verified (or already verified); token consumed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/VerifyEmailError"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags:
        - auth
      summary: Send a new verification email
      description: |
        Requires a session. Invalidates unused `verify_email` tokens for the
        current user, issues a new 24h token, and enqueues mail. If the email
        is already verified, returns 204 without sending.

        SMTP failure is logged and still returns 204 (the user can try again).
        Rate limited per IP and per user id. Origin must match `WEB_ORIGIN`.
        No request body.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Accepted (mail enqueued, already verified, or send skipped)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags:
        - auth
      summary: Request a password reset email
      description: |
        Always returns 202 for a well-formed email so callers cannot tell
        whether the address exists or is verified. A reset mail is enqueued
        **only** when a live user exists and `email_verified_at` is set.

        Issues a single-use `reset_password` token (1 hour TTL, SHA-256
        stored). A new request invalidates unused tokens of that purpose.
        SMTP/queue failure is logged and still returns 202.

        Rate limited per IP and per email hash. Origin must match `WEB_ORIGIN`.
        Unknown JSON fields are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            examples:
              email:
                value:
                  email: minh@example.com
      responses:
        "202":
          description: Accepted (mail may or may not have been enqueued)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - auth
      summary: Set a new password with a reset token
      description: |
        Consumes a single-use `reset_password` token, writes a new argon2id
        hash, and revokes **all** sessions for that user. Public: the token
        is the capability. No session cookie is set; the user signs in
        afterward.

        Unknown, expired, consumed, malformed, and wrong-purpose tokens all
        return 400 `invalid_token` with the same body. An empty token is 400
        `validation_error`. Success is 204.

        Rate limited per IP. Origin must match `WEB_ORIGIN`. Unknown JSON
        fields are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            examples:
              reset:
                value:
                  token: example-reset-token
                  newPassword: correct-horse-battery-2
      responses:
        "204":
          description: Password updated; all sessions revoked
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/ResetPasswordError"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags:
        - auth
      summary: Change or add a password while signed in
      description: |
        Requires a session. When `password_hash` is set, `currentPassword` is
        required and must match (wrong → 401 `invalid_credentials`). When
        `password_hash` is NULL (Google-only account, phase 4), omit
        `currentPassword` to add a password.

        On success, every existing session is revoked and a new session
        cookie is set for this device (204). Other devices must sign in
        again.

        Rate limited per IP and per user id. Origin must match `WEB_ORIGIN`.
        Unknown JSON fields are rejected.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            examples:
              change:
                value:
                  currentPassword: correct-horse-battery
                  newPassword: correct-horse-battery-2
      responses:
        "204":
          description: Password updated; this device given a new session
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/ChangePasswordUnauthorized"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/profile:
    get:
      operationId: getMyProfile
      tags:
        - profile
      summary: Own profile
      description: |
        Returns the signed-in user's profile, including email and
        `emailVerified`. Creates an empty `profiles` row when none exists
        (`username` is then null until onboarding).

        Date of birth is never included. Requires a valid session cookie.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Owner profile
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
              examples:
                onboarded:
                  value:
                    id: "193848201234567890"
                    username: minh
                    displayName: Minh
                    bio: Into the fold of friends.
                    avatarUrl: http://localhost:8080/v1/media/profile/193848201234567890/avatar/example-object.jpg
                    coverUrl: null
                    email: minh@example.com
                    emailVerified: true
                    usernameChangedAt: "2026-11-01T12:00:00Z"
                needsUsername:
                  value:
                    id: "193848201234567890"
                    username: null
                    displayName: Minh
                    bio: ""
                    avatarUrl: null
                    coverUrl: null
                    email: minh@example.com
                    emailVerified: false
                    usernameChangedAt: null
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: patchMyProfile
      tags:
        - profile
      summary: Update own profile text fields
      description: |
        Updates display name, bio, and/or username. Avatar and cover are
        separate upload endpoints. Unknown JSON fields are rejected. At least
        one field is required.

        Username is 3–20 characters `[a-z0-9_]`, stored lowercase. Reserved
        names are 400 `username_reserved`. Taken names are 409
        `username_taken`. A change within 14 days of the last successful
        username write is 409 `username_cooldown`. Repeating the current
        username is a no-op and does not refresh the cooldown.

        Rate limited per user. Origin must match `WEB_ORIGIN`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProfileRequest"
            examples:
              bio:
                value:
                  displayName: Minh
                  bio: Hello from Friendfold.
                  username: minh
      responses:
        "200":
          description: Updated owner profile
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "400":
          $ref: "#/components/responses/ProfilePatchError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "409":
          $ref: "#/components/responses/ProfileConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/profile/avatar:
    post:
      operationId: uploadMyAvatar
      tags:
        - profile
      summary: Upload avatar
      description: |
        Multipart field `file`. JPEG, PNG, or WebP only; GIF/PDF/SVG rejected.
        Client `Content-Type` and filename are not trusted. Max 5 MiB.

        The server transcodes to JPEG (quality 85), strips EXIF, and resizes
        so the long edge is at most 1024. Replaces any previous avatar.

        Rate limited per user. Origin must match `WEB_ORIGIN`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProfileImageUpload"
      responses:
        "200":
          description: Avatar stored; owner profile returned
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteMyAvatar
      tags:
        - profile
      summary: Remove avatar
      description: |
        Clears the avatar. The UI then shows initials. Origin must match
        `WEB_ORIGIN`.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Avatar cleared; owner profile returned
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/profile/cover:
    post:
      operationId: uploadMyCover
      tags:
        - profile
      summary: Upload cover photo
      description: |
        Multipart field `file`. JPEG, PNG, or WebP only. Max 10 MiB. Same
        sniffing and transcode as avatar; long edge at most 2048.

        Rate limited per user. Origin must match `WEB_ORIGIN`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProfileImageUpload"
      responses:
        "200":
          description: Cover stored; owner profile returned
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteMyCover
      tags:
        - profile
      summary: Remove cover photo
      description: |
        Clears the cover photo. Origin must match `WEB_ORIGIN`.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Cover cleared; owner profile returned
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/{username}:
    get:
      operationId: getUserProfile
      tags:
        - profile
      summary: Public profile by username
      description: |
        Returns public profile fields for a username (case-insensitive).
        Session cookie is optional.

        Never includes email, `emailVerified`, date of birth, or
        `usernameChangedAt`. Unknown usernames, deleted accounts, and
        blocked viewer/owner pairs (once friends/blocks exist) all return
        404 `not_found` with the same body.

        Rate limited per IP.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          description: |
            3–20 characters `[A-Za-z0-9_]`. Stored and compared lowercase.
          schema:
            $ref: "#/components/schemas/Username"
          example: minh
      responses:
        "200":
          description: Public profile
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
              examples:
                minh:
                  value:
                    id: "193848201234567890"
                    username: minh
                    displayName: Minh
                    bio: Into the fold of friends.
                    avatarUrl: http://localhost:8080/v1/media/profile/193848201234567890/avatar/example-object.jpg
                    coverUrl: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/media/{key}:
    get:
      operationId: getMediaObject
      tags:
        - profile
      summary: Fetch a stored image
      description: |
        Streams object bytes when `MEDIA_PUBLIC_BASE_URL` points at this API
        (local `fs` driver). Production CDNs serve the same keys from the
        bucket instead.

        `key` is the server-minted object key
        (`profile/{userId}/{kind}/{snowflake}.jpg`). Path traversal and
        unknown keys are 404. Public; no session.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: |
            Object key. Slashes are part of the key. Example values are
            fake (`example-object`), not production identifiers.
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^profile/[0-9]+/(avatar|cover)/[A-Za-z0-9-]+\\.jpg$"
          example: profile/193848201234567890/avatar/example-object.jpg
      responses:
        "200":
          description: JPEG bytes
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ProfileNotFound"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: friendfold_session
      description: |
        Opaque session id stored in Redis (`session:{id}`). Cookie flags:
        HttpOnly; SameSite=Lax; Path=/. Secure is on unless `COOKIE_SECURE=false`
        (local HTTP). TTL 30 days, sliding refresh at most once per hour.
  headers:
    RequestId:
      description: Echoed or generated request correlation id
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SetSessionCookie:
      description: |
        Sets `friendfold_session`. Flags: HttpOnly; SameSite=Lax; Path=/.
        Secure unless `COOKIE_SECURE=false`.
      schema:
        type: string
    ClearSessionCookie:
      description: Clears `friendfold_session` (Max-Age=0).
      schema:
        type: string
  responses:
    Error:
      description: Application error using the shared envelope
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: Resource not found
    ValidationError:
      description: Request JSON failed validation
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: validation_error
                  message: Request is invalid
    RegisterValidationError:
      description: |
        Register validation failed. `error.code` is one of `validation_error`,
        `underage`, or `terms_required`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            underage:
              value:
                error:
                  code: underage
                  message: You must be at least 13 years old
            terms:
              value:
                error:
                  code: terms_required
                  message: Terms of use and privacy policy must be accepted
            invalid:
              value:
                error:
                  code: validation_error
                  message: Request is invalid
    InvalidCredentials:
      description: Unknown email or wrong password (same body either way)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect
    ChangePasswordUnauthorized:
      description: |
        Missing session (`unauthenticated`) or wrong `currentPassword`
        (`invalid_credentials`). Both are 401.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: Authentication required
            invalid:
              value:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect
    Unauthenticated:
      description: Missing or invalid session
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: Authentication required
    OriginMismatch:
      description: Mutating request Origin does not match WEB_ORIGIN
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            mismatch:
              value:
                error:
                  code: origin_mismatch
                  message: Request origin is not allowed
    EmailTaken:
      description: Email already registered
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            taken:
              value:
                error:
                  code: email_taken
                  message: Email is already registered
    VerifyEmailError:
      description: |
        Verify failed. `error.code` is `invalid_token` (unknown, expired,
        consumed, or malformed) or `validation_error` (empty token or bad JSON).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: invalid_token
                  message: This verification link is invalid or has expired
            empty:
              value:
                error:
                  code: validation_error
                  message: token is required
    ResetPasswordError:
      description: |
        Reset failed. `error.code` is `invalid_token` (unknown, expired,
        consumed, malformed, or wrong purpose) or `validation_error` (empty
        token, bad password, or bad JSON).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: invalid_token
                  message: This reset link is invalid or has expired
            empty:
              value:
                error:
                  code: validation_error
                  message: token is required
    RateLimited:
      description: Too many attempts from this IP or email
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds until the client may retry
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            limited:
              value:
                error:
                  code: rate_limited
                  message: Too many attempts. Try again later
    ProfileNotFound:
      description: |
        Profile is missing, the account is deleted, or the viewer is blocked.
        Same body in every case (no existence leak).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missing:
              value:
                error:
                  code: not_found
                  message: Profile not found
    ProfilePatchError:
      description: |
        PATCH body failed. `error.code` is `validation_error`,
        `username_invalid`, or `username_reserved`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: validation_error
                  message: Request is invalid
            username:
              value:
                error:
                  code: username_invalid
                  message: Username must be 3–20 characters [a-z0-9_]
            reserved:
              value:
                error:
                  code: username_reserved
                  message: This username is not available
    ProfileConflict:
      description: |
        Username cannot be applied. `error.code` is `username_taken` or
        `username_cooldown`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            taken:
              value:
                error:
                  code: username_taken
                  message: Username is already taken
            cooldown:
              value:
                error:
                  code: username_cooldown
                  message: Username can be changed again after the 14-day cooldown
    InvalidImage:
      description: |
        Upload failed type, magic-byte, decode, or pixel-cap checks.
        `error.code` is `invalid_image` or `validation_error` (missing file).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            type:
              value:
                error:
                  code: invalid_image
                  message: Image must be JPEG, PNG, or WebP
            missing:
              value:
                error:
                  code: validation_error
                  message: file is required
    PayloadTooLarge:
      description: Avatar over 5 MiB or cover over 10 MiB
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            large:
              value:
                error:
                  code: payload_too_large
                  message: File is too large
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    UnavailableResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: unavailable
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
      examples:
        - error:
            code: not_found
            message: Resource not found
    SnowflakeId:
      type: string
      pattern: "^[0-9]+$"
      minLength: 1
      maxLength: 20
      description: Decimal string of a 64-bit Snowflake ID.
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - emailVerified
        - displayName
      properties:
        id:
          $ref: "#/components/schemas/SnowflakeId"
        email:
          type: string
          format: email
          maxLength: 254
        emailVerified:
          type: boolean
          description: True after a valid `verify_email` token is consumed.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
        - dateOfBirth
        - termsAccepted
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8–72 bytes; must not equal the email.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        dateOfBirth:
          type: string
          format: date
          description: Calendar date `YYYY-MM-DD`. Must be 13+ in UTC.
        termsAccepted:
          type: boolean
          description: Must be true; false returns 400 `terms_required`.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Unpadded base64url of 32 random bytes (~43 chars). Presented once
            in the email link; the API stores only SHA-256 of this string.
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Unpadded base64url of 32 random bytes (~43 chars). Presented once
            in the email link; the API stores only SHA-256 of this string.
            Example values in this spec are `example-reset-token`, not secrets.
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: 8–72 bytes; must not equal the account email.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          description: |
            Required when the account already has a password. Omit when adding
            a password to a Google-only account (`password_hash` is NULL).
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: 8–72 bytes; must not equal the account email.
    Username:
      type: string
      minLength: 3
      maxLength: 20
      pattern: "^[A-Za-z0-9_]+$"
      description: |
        3–20 characters `[A-Za-z0-9_]`. Stored lowercase. Path lookup is
        case-insensitive.
    PublicProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - bio
        - avatarUrl
        - coverUrl
      properties:
        id:
          $ref: "#/components/schemas/SnowflakeId"
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 160
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
          description: Absolute URL composed from MEDIA_PUBLIC_BASE_URL + object key.
        coverUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
    MeProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - bio
        - avatarUrl
        - coverUrl
        - email
        - emailVerified
        - usernameChangedAt
      properties:
        id:
          $ref: "#/components/schemas/SnowflakeId"
        username:
          type:
            - string
            - "null"
          minLength: 3
          maxLength: 20
          pattern: "^[A-Za-z0-9_]+$"
          description: Null until the owner claims a username.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 160
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
        coverUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
        email:
          type: string
          format: email
          maxLength: 254
        emailVerified:
          type: boolean
        usernameChangedAt:
          type:
            - string
            - "null"
          format: date-time
          description: UTC time of the last successful username write.
    PatchProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 160
        username:
          $ref: "#/components/schemas/Username"
    ProfileImageUpload:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, or WebP image. Field name is `file`.
