name: openapi

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: lint OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint --config redocly.yaml
