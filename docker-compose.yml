# Local development only. The default Postgres password is not for production.
# Host ports: Postgres 5435, Redis 6377 (containers stay 5432 / 6379).
# RustFS S3 API 9000, console 9001 (local-only credentials).
name: friendfold

services:
  postgres:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: friendfold
      POSTGRES_PASSWORD: friendfold
      POSTGRES_DB: friendfold
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendfold -d friendfold"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local-only S3 API (RustFS 1.0). Access/secret are not for production.
  # Default API driver is still fs; set MEDIA_DRIVER=s3 to use this.
  # Named volume: no host bind-mount, so no extra chown for user 10001.
  # The API creates MEDIA_S3_BUCKET on s3-driver startup (no init sidecar).
  rustfs:
    image: rustfs/rustfs:1.0.3
    user: "10001:10001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: friendfold
      RUSTFS_SECRET_KEY: friendfold
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs_data:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  rustfs_data:
