# Local development only. The default Postgres password is not for production.
# Host ports: Postgres 5435, Redis 6377 (containers stay 5432 / 6379).
# MinIO S3 API 9000, console 9001 (local-only credentials).
name: friendfold

services:
  postgres:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: friendfold
      POSTGRES_PASSWORD: friendfold
      POSTGRES_DB: friendfold
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendfold -d friendfold"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local-only S3 API. Root user/password are not for production.
  # Default API driver is still fs; set MEDIA_DRIVER=s3 to use this.
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: friendfold
      MINIO_ROOT_PASSWORD: friendfold
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
